[package]
name = "iapolitique"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Backend of iapolitique: API, worker and migrations"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.13"
# Request body wrapper of http::middleware::close_unread_body; already in the tree via axum.
http-body = "1"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.59", default-features = false }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "derive", "macros", "migrate", "json", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "compression-gzip", "compression-br", "sensitive-headers", "set-header", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
# NFKC folding of visitor text (prompt frame neutralization); already in the tree via sqlx.
unicode-normalization = "0.1"
# Normalization of the source URLs of analyses; already in the tree via reqwest.
url = "2"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
# Keep symbol names (readable panic backtraces), drop the bulky debug info.
strip = "debuginfo"
