# nginx configuration of the iapolitique frontend image (static SPA only).
#
# - /api is NOT handled here: Traefik routes it to the api service (AGENTS.md §3.1). A request
#   reaching nginx under /api is a routing mistake and gets a JSON 404, never index.html.
# - Anonymity (AGENTS.md §7.1): the access log holds no client IP, user agent, referrer or query
#   string, and tracking tokens (/suivi/<token>) are redacted.
# - Caching: hashed build assets are immutable for a year; everything else is revalidated.

user nginx;
worker_processes auto;

# Only critical errors: lower levels include the client address in their messages.
error_log /dev/stderr crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Static site: only small GET requests are expected.
    client_max_body_size 16k;

    # --- Anonymous access log ----------------------------------------------------------------
    # The path as requested (not $uri, which becomes /index.html after the SPA fallback), without
    # its query string. Tracking links are redacted, and so is any path containing "suivi" or a
    # percent-encoded character (an encoded "/suivi/" must not leak a token either).
    map $request_uri $loggable_path {
        ~*^/suivi/          "/suivi/[redacted]";
        ~*(suivi|%)         "[redacted]";
        ~^(?<path>[^?]*)    $path;
        default             "[redacted]";
    }
    log_format anonymous '$time_iso8601 "$request_method $loggable_path" $status '
                         '$body_bytes_sent $request_time';
    access_log /dev/stdout anonymous;

    # --- Compression --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # --- Caching --------------------------------------------------------------------------------
    # Vite fingerprints everything under /assets/: safe to cache forever. index.html and the
    # public files keep their name across deployments: always revalidate (ETag makes it cheap).
    map $uri $cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS ends at Traefik: never build absolute http:// redirects.
        absolute_redirect off;

        # Headers are set at server level only (an add_header inside a location would drop them).
        # Without "always", Cache-Control is only sent on successful responses: a missing asset's
        # 404 is never cached.
        add_header Cache-Control $cache_control;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Liveness probe (Docker HEALTHCHECK / Swarm healthcheck).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Ressource introuvable."}}';
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Ressource introuvable."}}';
        }

        # Fingerprinted build output: a missing file is a real 404 (never index.html, which
        # would be parsed as JavaScript after a deployment).
        location ^~ /assets/ {
            try_files $uri =404;
        }

        # SPA: any other path is a client-side route (French paths, 404 page included).
        location / {
            try_files $uri /index.html;
        }
    }
}
