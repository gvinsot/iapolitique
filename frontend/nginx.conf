# nginx configuration of the iapolitique frontend image (static SPA only).
#
# - /api is NOT handled here: Traefik routes it to the api service (AGENTS.md §3.1). A request
#   reaching nginx under /api is a routing mistake and gets a JSON 404, never index.html.
# - Anonymity (AGENTS.md §7.1): the access log holds no client IP, user agent, referrer or query
#   string, and tracking tokens (/suivi/<token>) are redacted.
# - Security headers (AGENTS.md §14.2) are set here on every response. Behind Traefik, the
#   `security-headers` middleware of `global@file` (shared infrastructure, outside this
#   repository) replaces the ones it also sets: Strict-Transport-Security, X-Frame-Options,
#   X-Content-Type-Options, Referrer-Policy and X-Robots-Tag (see docs/ops.md).
# - Caching: hashed build assets are immutable for a year; everything else is revalidated, and
#   the tracking and administration pages are never stored.
# - Only GET and HEAD exist. Dotfiles are never served, except /.well-known/security.txt.
# Checked by devops/check_frontend_headers.sh (CI: devops/Dockerfile.test) and, in a real
# browser, by devops/dev/browser_check.sh.

user nginx;
worker_processes auto;

# Only critical errors: lower levels include the client address in their messages.
error_log /dev/stderr crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Static site: only small GET requests are expected.
    client_max_body_size 16k;

    # --- Anonymous access log ----------------------------------------------------------------
    # The path as requested (not $uri, which becomes /index.html after the SPA fallback), without
    # its query string. Tracking links are redacted, and so is any path containing "suivi" or a
    # percent-encoded character (an encoded "/suivi/" must not leak a token either).
    # A regex capture used in a map is one of the configurations hit by the nginx memory bugs of
    # 2026-10-14 (CVE-2026-15176, CVE-2026-93479, CVE-2026-97205): it needs nginx 1.30.6 / 1.31.7
    # or later, enforced by devops/check_image_pins.py. No alias, rewrite, SSI or aio is used.
    map $request_uri $loggable_path {
        ~*^/suivi/          "/suivi/[redacted]";
        ~*(suivi|%)         "[redacted]";
        ~^(?<path>[^?]*)    $path;
        default             "[redacted]";
    }
    log_format anonymous '$time_iso8601 "$request_method $loggable_path" $status '
                         '$body_bytes_sent $request_time';
    access_log /dev/stdout anonymous;

    # --- Compression --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # --- Private pages ------------------------------------------------------------------------
    # The tracking page (its token lives in the URL fragment) and the administration: never
    # stored, never indexed. Matched on the path as requested (not $uri, which becomes
    # /index.html after the SPA fallback) and case-insensitively, like the client-side router;
    # a percent-encoded path is treated alike, as it may spell either of them.
    map $request_uri $private_page {
        ~*^/(suivi|admin)(/|\?|$)   1;
        ~%                          1;
        default                     0;
    }
    map $private_page $robots_tag {
        1                   "noindex, nofollow";
        default             "";
    }

    # --- Caching --------------------------------------------------------------------------------
    # Vite fingerprints everything under /assets/: safe to cache forever. index.html and the
    # public files keep their name across deployments: always revalidate. index.html carries a
    # new CSP nonce on every response (below), so it has no ETag and is always sent in full.
    map "$private_page:$uri" $cache_control {
        ~^1:                "no-store";
        ~^0:/assets/        "public, max-age=31536000, immutable";
        default             "no-cache";
    }

    # Allow header of the 405 answer to any method other than GET and HEAD.
    map $request_method $allow_header {
        GET                 "";
        HEAD                "";
        default             "GET, HEAD";
    }

    # --- Content-Security-Policy (AGENTS.md §14.2) ----------------------------------------------
    # Scripts: same-origin files only (no inline script, no eval). Styles: same-origin files,
    # plus the <style> elements that libraries inject at run time, each allowed explicitly:
    #   - the nonce, new on every response ($request_id: 128 random bits), for the scrollbar
    #     compensation style of react-remove-scroll (Radix dialogs and selects), whose content
    #     depends on the scrollbar width: index.html gets it on its theme-init.js script tag
    #     (sub_filter, location = /index.html) and public/theme-init.js copies it to
    #     window.__webpack_nonce__, which react-style-singleton puts on its <style>;
    #   - the hashes of fixed contents: sonner's stylesheet (inserted empty then filled, hence
    #     the hash of the empty string too) and the viewport style of Radix Select. They are
    #     checked against node_modules by src/test/csp.test.ts: update them with the library.
    # style-src-attr 'unsafe-inline': style attributes only (Radix positioning, ALTCHA widget).
    # worker-src 'self': the ALTCHA proof-of-work worker is a same-origin file (altcha/worker),
    # no blob: worker (checked in a browser by devops/dev/browser_check.sh).
    # The header itself is set in the server block.

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS ends at Traefik: never build absolute http:// redirects.
        absolute_redirect off;

        # Headers are set at server level only (an add_header inside a location would drop them).
        # Without "always", Cache-Control is only sent on successful responses: a missing asset's
        # 404 is never cached. An empty value (X-Robots-Tag, Allow) sends no header.
        add_header Cache-Control $cache_control;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://stats.methodinfo.fr; style-src 'self' 'nonce-$request_id' 'sha256-StEaX+se6YS7pqjzrzMIA0KaX9zF/8zAhvQXZAe5epY=' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-441zG27rExd4/il+NvIqyL8zFx5XmyNQtE381kSkUJk='; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://stats.methodinfo.fr; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Allow $allow_header always;

        # A static site: nothing but GET and HEAD.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Dotfiles and dot-directories (.git, .env, …) are never served, nor routed to the SPA.
        # $uri is decoded and normalised: an encoded dot is caught too.
        if ($uri ~ "(^|/)\.(?!well-known/security\.txt$)") {
            return 404;
        }

        # Liveness probe (Docker HEALTHCHECK / Swarm healthcheck).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # RFC 9116, rendered at container start from LEGAL_CONTACT_EMAIL by
        # /docker-entrypoint.d/16-security-txt.envsh into $NGINX_ENVSUBST_OUTPUT_DIR; absent
        # (404) when the address is not configured.
        location = /.well-known/security.txt {
            root /run/nginx-generated;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /api {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Ressource introuvable."}}';
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Ressource introuvable."}}';
        }

        # Fingerprinted build output: a missing file is a real 404 (never index.html, which
        # would be parsed as JavaScript after a deployment).
        location ^~ /assets/ {
            try_files $uri =404;
        }

        # The SPA shell: hands this response's CSP nonce to theme-init.js (see the CSP above).
        location = /index.html {
            sub_filter '<script src="/theme-init.js"></script>' '<script nonce="$request_id" src="/theme-init.js"></script>';
            sub_filter_once on;
        }

        # SPA: any other path is a client-side route (French paths, 404 page included).
        location / {
            try_files $uri /index.html;
        }
    }
}
